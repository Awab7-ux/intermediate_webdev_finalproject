<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interest Rate Calculator</title>
  <meta name="description" content="Free online interest rate calculator. Calculate simple interest and the total amount on your savings or loans instantly.">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Interest Rate Calculator</h1>
  </header>
  <main>
    <label for="principal">Principal</label>
    <input type="number" id="principal" min="0" step="any">

    <label for="rate">Annual interest rate (%)</label>
    <input type="number" id="rate" min="0" step="any">

    <label for="time">Time (years)</label>
    <input type="number" id="time" min="0" step="any">

    <button id="calculate" type="button">Calculate</button>
    <p id="result"></p>
  </main>
  <footer>
    <p>&copy; 2026 Interest Rate Calculator</p>
  </footer>
  <script src="src/script.js"></script>
</body>
</html>
